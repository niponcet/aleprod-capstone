<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Diag B</title>
  <style>
    html, body { margin: 0; background: #070B14; color: #0f0; font: 14px monospace; }
    #hud { padding: 60px 12px; white-space: pre; }
    #bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: red;
      color: #fff;
      font: bold 14px sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="bottom-bar">BOTTOM: 0 (BARRA ROJA)</div>
  <script>
    function paint() {
      var bar = document.getElementById('bottom-bar');
      var barRect = bar ? Math.round(bar.getBoundingClientRect().bottom) : '-';
      document.getElementById('hud').textContent =
        'innerH: ' + innerHeight +
        '\nscreenH: ' + screen.height +
        '\nbar bottom: ' + barRect +
        '\nstandalone: ' + navigator.standalone;
    }
    paint(); setInterval(paint, 2000);
  </script>
</body>
</html>
