<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Diag D</title>
  <style>
    html, body { margin: 0; background: #070B14; color: #0f0; font: 14px monospace; }
    #hud { padding: 60px 12px; white-space: pre; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <script>
    function paint() {
      document.getElementById('hud').textContent =
        'innerH: ' + innerHeight + '\nscreenH: ' + screen.height +
        '\nstandalone: ' + navigator.standalone;
    }
    paint(); setInterval(paint, 2000);
  </script>
</body>
</html>
