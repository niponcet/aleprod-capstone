<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Aleprod Terreno</title>
    
    <!-- PWA iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      /* Utilidades inyectables */
      .edge-to-edge-pb { padding-bottom: calc(var(--sab) + 70px) !important; }
      .edge-to-edge-pt { padding-top: max(calc(var(--sat) + 12px), 20px) !important; }

      /* Base y reseteo Edge-to-Edge limpio para WebKit con fusión cromática a status bar */
      html {
        position: fixed;
        inset: 0;
        width: 100%;
        background-color: #000000 !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        position: fixed;
        inset: 0;
        width: 100%;
        background-color: #000000 !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        flex: 1;
        background-color: #000000 !important;
        overflow: hidden;
      }

      /* Fix Auto-Zoom Safari */
      input, textarea, select { font-size: 16px !important; }

      /* Erradicar el fondo amarillento/blanco de Autofill en iOS Safari y Chrome */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #14171C inset !important;
        box-shadow: 0 0 0 1000px #14171C inset !important;
        -webkit-text-fill-color: #FFFFFF !important;
        caret-color: #FFFFFF !important;
        border-radius: 8px !important;
        transition: background-color 50000s ease-in-out 0s;
      }

      /* Eliminar el contorno/outline por defecto del navegador al hacer focus */
      input:focus, textarea:focus, select:focus {
        outline: none !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Capa protectora que garantiza la barra de estado superior 100% negra en iOS PWA -->
    <div id="ios-status-bar-fill" style="position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background-color: #000000; z-index: 99999; pointer-events: none;"></div>
    <div id="root"></div>
    <script>
      // Parche universal iOS WebKit: restauración síncrona de viewport tras cierre de teclado en PWA / Safari
      function resetWebKitViewport() {
        window.scrollTo(0, 0);
        var root = document.getElementById('root');
        if (root) {
          root.style.bottom = '';
          root.style.display = 'none';
          root.offsetHeight; // Forzar reflow síncrono para eliminar la compresión de WebKit
          root.style.display = 'flex';
        }
      }

      document.addEventListener('focusout', function(e) {
        if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(e.target.tagName) !== -1) {
          setTimeout(resetWebKitViewport, 100);
        }
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
          if (window.visualViewport.height >= window.innerHeight * 0.85) {
            resetWebKitViewport();
          }
        });
      }
    </script>
  </body>
</html>
