<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Aleprod Terreno</title>
    
    <!-- PWA iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#070B14" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      /* Parche WebKit iOS para el glitch de 0px al navegar */
      @supports (-webkit-touch-callout: none) {
        :root {
          --sat: max(env(safe-area-inset-top), 47px);
        }
      }
      /* Utilidades inyectables */
      .edge-to-edge-pb { padding-bottom: calc(var(--sab) + 70px) !important; }
      .edge-to-edge-pt { padding-top: max(calc(var(--sat) + 12px), 20px) !important; }

      /* Base y reseteo Edge-to-Edge limpio para WebKit con diagnóstico cromático */
      html {
        position: fixed;
        inset: 0;
        width: 100%;
        background-color: red !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        position: fixed;
        inset: 0;
        width: 100%;
        background-color: green !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        flex: 1;
        background-color: blue !important;
        overflow: hidden;
      }

      /* Fix Auto-Zoom Safari */
      input, textarea, select { font-size: 16px !important; }

      /* Erradicar el fondo amarillento/blanco de Autofill en iOS Safari y Chrome */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #14171C inset !important;
        box-shadow: 0 0 0 1000px #14171C inset !important;
        -webkit-text-fill-color: #FFFFFF !important;
        caret-color: #FFFFFF !important;
        border-radius: 8px !important;
        transition: background-color 50000s ease-in-out 0s;
      }

      /* Eliminar el contorno/outline por defecto del navegador al hacer focus */
      input:focus, textarea:focus, select:focus {
        outline: none !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Parche universal iOS WebKit: restauración síncrona de viewport tras cierre de teclado en PWA / Safari
      function resetWebKitViewport() {
        window.scrollTo(0, 0);
        var root = document.getElementById('root');
        if (root) {
          root.style.display = 'none';
          root.offsetHeight; // Forzar reflow síncrono para eliminar la compresión de WebKit
          root.style.display = 'flex';
        }
      }

      document.addEventListener('focusout', function(e) {
        if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(e.target.tagName) !== -1) {
          setTimeout(resetWebKitViewport, 100);
        }
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
          if (window.visualViewport.height >= window.innerHeight * 0.85) {
            resetWebKitViewport();
          }
        });
      }

      // Sonda de diagnóstico visual en vivo (PWA iPhone)
      window.addEventListener('load', function () {
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;top:60px;left:8px;z-index:99999;background:rgba(0,0,0,.85);color:#0f0;font:11px monospace;padding:6px;white-space:pre;pointer-events:none';
        document.body.appendChild(box);
        function paint() {
          var r = document.getElementById('root').getBoundingClientRect();
          var cs = getComputedStyle(document.getElementById('root'));
          var probe = document.createElement('div');
          probe.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom)';
          document.body.appendChild(probe);
          var sab = probe.offsetHeight; probe.remove();
          box.textContent =
            'innerH: ' + window.innerHeight + '\n' +
            'screenH: ' + screen.height + '\n' +
            'vvH: ' + (window.visualViewport ? window.visualViewport.height : '-') + '\n' +
            'root top/bottom: ' + Math.round(r.top) + ' / ' + Math.round(r.bottom) + '\n' +
            'root pos/height: ' + cs.position + ' / ' + cs.height + '\n' +
            'sab: ' + sab;
        }
        paint(); setTimeout(paint, 1500); setInterval(paint, 3000);
      });
    </script>
  </body>
</html>
